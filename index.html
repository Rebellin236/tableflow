<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fousty</title>
<meta name="description" content="Fousty : le carnet de suivi alimentation, sport, santé.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101217" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fousty">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="skin-font" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<script>
/* styles : polices de chaque style (seules celles du style choisi sont chargées) ; le dernier style utilisé sur ce téléphone
   est appliqué avant l'affichage pour éviter un flash du style par défaut */
window.FOUSTY_FONTS={
  box:"Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600;700",
  pop:"Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700",
  neon:"Unbounded:wght@600;700&family=Manrope:wght@400;500;600;700;800",
  calanques:"Baloo+2:wght@600;700;800&family=Nunito:wght@400;500;600;700;800",
  bd:"Bangers&family=Comic+Neue:wght@400;700"};
(function(){try{var t=JSON.parse(localStorage.getItem("fousty-theme")||"null");if(!t||!window.FOUSTY_FONTS[t.skin])return;
  var d=document.documentElement,m=t.skin==="neon"?"dark":t.mode;d.setAttribute("data-skin",t.skin);if(m==="light"||m==="dark")d.setAttribute("data-theme",m);
  document.getElementById("skin-font").href="https://fonts.googleapis.com/css2?family="+window.FOUSTY_FONTS[t.skin]+"&display=swap"}catch(e){}})();
</script>
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
*{box-sizing:border-box}
/* Layout: one-column phone app. Day header, summary card, meal slots labelled like the box whiteboard, session + weigh-in cards, fixed bottom tab bar. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface2:#eaedf2; --ink:#14171d; --ink2:#5a6170; --line:#dce1e8;
  --red:#c13727; --red-soft:#fae8e5; --blue:#2756a6; --blue-soft:#e5ecf8;
  --good:#1a7b34; --good-soft:#e2f3e6; --warn:#956100; --warn-soft:#faefd6;
  --scrim:rgba(10,12,16,.42); --on-red:#ffffff;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:var(--f-display);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101217; --surface:#1a1d24; --surface2:#242832; --ink:#eef0f4; --ink2:#a3a9b6; --line:#2d323d;
  --red:#ff6d5c; --red-soft:#3a201c; --blue:#7fa8f2; --blue-soft:#1d2840;
  --good:#5ac872; --good-soft:#17301e; --warn:#e6a83c; --warn-soft:#33281a;
  --scrim:rgba(0,0,0,.6); --on-red:#1c0c09; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101217; --surface:#1a1d24; --surface2:#242832; --ink:#eef0f4; --ink2:#a3a9b6; --line:#2d323d;
  --red:#ff6d5c; --red-soft:#3a201c; --blue:#7fa8f2; --blue-soft:#1d2840;
  --good:#5ac872; --good-soft:#17301e; --warn:#e6a83c; --warn-soft:#33281a;
  --scrim:rgba(0,0,0,.6); --on-red:#1c0c09; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
textarea{resize:vertical;min-height:72px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--blue);outline-offset:1px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(150px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
.hint{font-size:13px;color:var(--ink2)}

/* whiteboard tag: | FOR TIME | with a hatched marker underline */
.tag{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.07em;text-transform:uppercase;color:var(--red);display:inline-block;line-height:1;padding:2px 6px 6px;border-left:2px solid currentColor;border-right:2px solid currentColor;background:repeating-linear-gradient(-55deg,currentColor 0 1.4px,transparent 1.4px 5px) left bottom/100% 4px no-repeat}
.tag.blue{color:var(--blue)}

.banner{border-radius:12px;padding:10px 12px;font-size:13.5px;background:var(--warn-soft);color:var(--ink)}
.banner.info{background:var(--blue-soft)}

/* day header */
.dayhead{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:6px}
.ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;color:var(--ink2);background:var(--surface);border:1px solid var(--line)}
.dh-mid{text-align:center;min-width:0}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.dh-title{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.05;margin:2px 0 0;text-wrap:balance}
.linkbtn{align-self:center;font-size:13px;font-weight:600;color:var(--blue);padding:4px 8px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{border-radius:9px;padding:9px 6px;font-size:13.5px;font-weight:600;color:var(--ink2);line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button small{display:block;font-weight:500;font-size:11.5px;color:var(--ink2)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px}

/* summary */
.sum-top{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.ring{position:relative;width:96px;height:96px}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring-txt b{font-family:var(--f-num);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.ring-txt span{font-size:11.5px;color:var(--ink2);margin-top:2px}
.metric{display:flex;flex-direction:column;gap:5px;min-width:0}
.metric-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lab{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.metric-top .num{font-size:20px;font-weight:700}
.metric-top .num small{font-size:14px;color:var(--ink2);font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.bar i.ok{background:var(--good)}
.bar i.over{background:var(--warn)}
.metric + .metric{margin-top:8px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chip{display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px;padding:8px 4px;background:var(--surface2);font-size:12px;font-weight:600;color:var(--ink2);text-align:center;line-height:1.15}
.chip .ico{font-size:15px;line-height:1}
.chip.on{background:var(--good-soft);color:var(--good)}
.chip.tap{border:1px dashed var(--line)}
.chip.tap.on{border-color:transparent}

/* meal slots */
.slots{display:flex;flex-direction:column;gap:6px}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 12px 10px}
.slot-h{display:flex;align-items:center;gap:8px;min-height:36px}
.slot-h .sp,.sheet-h .sp{flex:1}
.slot-tot{margin-top:4px;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.cant{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap;cursor:pointer;padding:6px 0}
.cant input{width:18px;height:18px;padding:0;margin:0;accent-color:var(--blue)}
.cant:has(input:checked){color:var(--blue)}
.item-v .chev{display:inline-block;margin-left:6px}
.item-main[aria-expanded="true"] .chev{transform:rotate(90deg)}
.in-slot{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.in-slot li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.in-slot li:first-child{border-top:0}
.in-slot .n{min-width:0;font-weight:500}
.in-slot .v{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.in-slot .x{font-size:12.5px;font-weight:600;color:var(--red);background:var(--red-soft);border-radius:8px;padding:6px 9px}
.add{flex:none;font-size:13.5px;font-weight:700;color:var(--red);background:var(--red-soft);border-radius:10px;padding:8px 11px}
.items{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.item{border-top:1px solid var(--line)}
.item-main{width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 2px;text-align:left}
.item-name{min-width:0;font-weight:500}
.item-name em{font-style:normal;color:var(--blue);font-weight:700;margin-left:4px}
.item-v{flex:none;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.item-ctl{display:flex;align-items:center;gap:8px;padding:0 2px 10px}
.item-ctl .q{width:40px;height:36px;border-radius:10px;background:var(--surface2);font-size:20px;font-weight:600}
.item-ctl .qv{min-width:44px;text-align:center;font-family:var(--f-num);font-size:18px;font-weight:700}
.item-ctl .del{margin-left:auto;font-size:13px;font-weight:600;color:var(--red);padding:8px 10px;border-radius:10px;background:var(--red-soft)}

label.fl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:-6px}
.w-row{display:flex;align-items:center;gap:10px}
.w-row input{max-width:140px;font-family:var(--f-num);font-size:24px;font-weight:700;padding:8px 12px}
.w-row span{font-weight:600;color:var(--ink2)}
.pill{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--blue);background:var(--blue-soft);border-radius:99px;padding:4px 9px}

/* bottom sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;margin:0 auto;max-width:560px;max-height:86vh;max-height:86dvh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding-top:12px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;display:flex;flex-direction:column;gap:12px;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.done{font-weight:700;color:var(--surface);background:var(--ink);border-radius:10px;padding:9px 14px;font-size:14px}
.grp-lab{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:2px 0 -4px}
.fav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.fav{display:flex;flex-direction:column;gap:3px;text-align:left;border-radius:12px;padding:10px 11px;background:var(--surface2);min-width:0;border:1px solid transparent}
.fav:active{border-color:var(--red)}
.fav b{font-weight:600;font-size:14px;line-height:1.25}
.fav span{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
details.free{border-top:1px solid var(--line);padding-top:10px}
details.free summary{font-weight:700;cursor:pointer;padding:6px 0}
.form{display:grid;gap:10px;margin-top:8px}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checks{display:flex;flex-wrap:wrap;gap:14px;font-size:14px}
.checks label{display:flex;align-items:center;gap:6px}
.checks input{width:18px;height:18px;padding:0}
.btn{font-weight:700;border-radius:12px;padding:12px 14px;background:var(--red);color:var(--on-red);text-align:center}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}

/* analyse IA */
.recap{display:flex;flex-direction:column;gap:10px}
.rc-title{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.1;margin:0;text-wrap:balance}
.rc-sec{display:flex;flex-direction:column;gap:4px}
.rc-sec ul,.rc-sec ol{margin:0;padding-left:20px;display:grid;gap:4px}
.rc-lab{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.rc-lab.ok{color:var(--good)}
.rc-lab.warn{color:var(--red)}
.card[aria-label="Contexte pour l'analyse"]{display:flex;flex-direction:column;gap:8px}
textarea#set-coach{resize:vertical;min-height:80px}

/* compte */
.consent{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-size:13.5px;line-height:1.45;color:var(--ink)}
.consent input{width:20px;height:20px;padding:0;margin:1px 0 0}
.auth-links{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px}
.acct-btns{display:grid;gap:8px;margin-top:10px}
.danger-l{color:var(--red);align-self:flex-start;padding:4px 0}
.card[aria-label="Mon compte"]{display:flex;flex-direction:column;gap:10px}

/* week */
.wk-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--f-num);font-size:28px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.tile span{font-size:12.5px;color:var(--ink2)}
.habits{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hab{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;font-size:12px;color:var(--ink2);font-weight:600}
.hab b{display:block;font-family:var(--f-num);font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.drow{width:100%;display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;text-align:left;padding:10px 0;border-top:1px solid var(--line)}
.drow:first-child{border-top:0}
.drow .dl{font-family:var(--f-display);font-size:18px;font-weight:700;line-height:1}
.drow .dl small{display:block;font-family:var(--f-body);font-size:11.5px;font-weight:500;color:var(--ink2);margin-top:2px}
.pbar{position:relative;height:10px;border-radius:99px;background:var(--surface2)}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--blue)}
.pbar i.ok{background:var(--good)}
.pbar .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink2);border-radius:2px}
.dmeta{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:5px;font-size:11.5px;color:var(--ink2);min-width:0}
.dot{display:inline-flex;align-items:center;gap:3px}
.dot i{width:7px;height:7px;border-radius:9px;background:var(--line)}
.dot.on i{background:var(--good)}
.dv{text-align:right;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums;line-height:1.3}
.dv b{color:var(--ink);font-size:14px}
.sess{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.sess li{display:grid;grid-template-columns:52px 1fr;gap:10px;font-size:13.5px}
.sess .r{font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--blue)}
.copybox{font-size:12.5px;min-height:160px}

/* plats */
.fl-item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.fl-item:first-of-type{border-top:0}
.fl-item .n{font-weight:600;min-width:0}
.fl-item .m{font-size:12.5px;color:var(--ink2)}
.fl-act{display:flex;gap:6px}
.fl-act button{font-size:12.5px;font-weight:600;padding:7px 9px;border-radius:9px;background:var(--surface2)}
.fl-act .danger{color:var(--red);background:var(--red-soft)}

/* perfs */
.lift{border-top:1px solid var(--line)}
.lift:first-child{border-top:0}
.lift-main{width:100%;display:grid;grid-template-columns:1fr auto 14px;gap:10px;align-items:center;padding:12px 0;text-align:left}
.lift-main .n{font-weight:600;min-width:0}
.lift-main .d{display:block;font-size:12px;color:var(--ink2);font-weight:500;margin-top:2px}
.lift-main .d.warn{color:var(--warn)}
.lift-main .v{font-family:var(--f-num);font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.lift-main .v small{font-size:14px;color:var(--ink2);font-weight:600}
.lift-main .v .est{color:var(--ink2)}
.chev{color:var(--ink2);font-size:18px;line-height:1;transition:transform .15s}
.lift-main[aria-expanded="true"] .chev{transform:rotate(90deg)}
.lift-body{display:flex;flex-direction:column;gap:12px;padding:0 0 14px}
.rms{display:flex;flex-wrap:wrap;gap:6px}
.rm{background:var(--surface2);border-radius:10px;padding:6px 10px;font-size:12.5px;color:var(--ink2);font-weight:600}
.rm b{font-family:var(--f-num);font-size:18px;color:var(--ink);margin-left:4px;font-variant-numeric:tabular-nums}
.pct{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pct div{background:var(--surface2);border-radius:10px;padding:6px 2px;text-align:center;font-size:11.5px;color:var(--ink2);font-weight:600}
.pct b{display:block;font-family:var(--f-num);font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.hist .hd{color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.hist .hv{font-weight:600;min-width:0}
.hist .hv small{display:block;font-weight:400;color:var(--ink2);font-size:12px}
.hist .x{font-size:12px;font-weight:600;color:var(--red);background:var(--red-soft);border-radius:8px;padding:5px 8px}
.pr{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--good);background:var(--good-soft);border-radius:99px;padding:2px 7px;margin-left:6px;vertical-align:1px}
.daylifts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.add.blue{color:var(--blue);background:var(--blue-soft)}
.est-note{font-size:12.5px;color:var(--ink);background:var(--blue-soft);border-radius:10px;padding:8px 10px}
.item-edit{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 2px 8px}
.item-edit label{display:block;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);margin-bottom:4px}
.item-edit input{padding:8px 10px}
.item-edit .checks label{display:flex;margin:0;font-size:14px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink)}
.todo{color:var(--warn);font-weight:600}
.ctag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);background:var(--surface2);border-radius:99px;padding:2px 7px;margin-left:6px;vertical-align:1px}

/* aliments */
.foods{display:flex;flex-direction:column}
.food{width:100%;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;text-align:left;padding:9px 2px;border-top:1px solid var(--line)}
.food:first-child{border-top:0}
.food b{font-weight:500;font-size:14px;line-height:1.3;min-width:0}
.food b small{display:block;font-weight:400;font-size:12px;color:var(--ink2);margin-top:1px}
.food span{font-size:11.5px;line-height:1.25;color:var(--ink2);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pick{display:flex;flex-direction:column;gap:10px;background:var(--surface2);border-radius:14px;padding:12px}
.pick-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pick-h b{font-size:16px;line-height:1.25;min-width:0}
.pick input,.pick select{background:var(--surface)}
.pick .row2{display:grid;grid-template-columns:1fr 1.3fr;gap:8px}
.pick-res{font-family:var(--f-num);font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.pick-res small{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--ink2)}

/* v2 : compléments, forme, poids, alcool, annuler */
.chips.three{grid-template-columns:repeat(3,1fr)}
.supps{display:flex;flex-wrap:wrap;gap:6px}
.supp{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600;background:var(--surface2);color:var(--ink2);border:1px dashed var(--line)}
.supp.on{background:var(--good-soft);color:var(--good);border-color:transparent}
.supp-edit{display:flex;flex-wrap:wrap;gap:6px}
.supp-edit .supp button{font-size:16px;line-height:1;padding:0 2px;color:inherit}
.supp-add{display:grid;grid-template-columns:1fr auto;gap:8px}
.supp-add .btn{padding:10px 14px}
/* fruits et légumes, sucré, tabac, eau, modules */
.chip small{font-size:10.5px;font-weight:600;opacity:.85}
.chip b.num{font-size:13.5px}
.sugar-row,.tob-row{display:flex;align-items:center;gap:10px}
.chips.two{grid-template-columns:repeat(2,1fr)}
.sugar-row .lab{flex:1}
.sugar-row .q,.tob-row .q{flex:none;width:44px;height:40px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:20px;font-weight:600;color:var(--ink)}
.tob-row .lab{flex:1;min-width:0}
.sugar-row .num,.tob-row .num{min-width:30px;text-align:center;font-size:20px}
.sugar-row .hint{flex:1;min-width:0;font-size:12px}
.sugar-row .q:disabled,.tob-row .q:disabled{opacity:.4}
.tob-rows{display:flex;flex-direction:column;gap:8px}
.water-n{display:inline-flex;align-items:center;gap:6px}
.water-n svg{width:22px;height:22px;color:var(--blue);flex:none}
.water-btns button{display:flex;align-items:center;justify-content:center;gap:5px;line-height:1.15}
.water-btns button svg{width:18px;height:18px;flex:none}
.mod-d{display:block;font-size:12px;font-weight:500;color:var(--ink2)}
.eve-it.on .mod-d{color:inherit;opacity:.8}
.pill.warn{color:var(--warn);background:var(--warn-soft)}
/* check du soir */
.eve-list{display:flex;flex-direction:column;gap:6px}
.eve-it{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 12px;border-radius:12px;background:var(--surface2);color:var(--ink);font-weight:600;text-align:left}
.eve-it.on{background:var(--good-soft);color:var(--good)}
.eve-box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:14px;font-weight:800;line-height:1}
.eve-it.on .eve-box,.eve-done .eve-box{border-color:var(--good);background:var(--good);color:var(--surface)}
.eve-done{display:flex;align-items:center;gap:10px;margin:0;font-weight:700;color:var(--good)}
.eve-more summary{font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;padding:4px 0}
.eve-more .eve-list{margin-top:6px}
.eve.eve-ok .pill{color:var(--good);background:var(--good-soft)}
.seg.five button{padding:7px 2px;font-size:15px}
.seg.five small{font-size:10.5px}
.seg.seven button{padding:9px 0;font-size:12.5px}
details.body{border-top:1px solid var(--line);padding-top:8px}
details.body summary{font-weight:600;font-size:14px;cursor:pointer;padding:4px 0}
.body-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.body-grid label{display:block;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);margin-bottom:4px}
.body-grid input{padding:8px 10px}
.wchart{width:100%;height:auto;display:block}
.wchart .gl{stroke:var(--line);stroke-width:1}
.wchart .ax{fill:var(--ink2);font-size:10px;font-family:var(--f-body)}
.wchart .wpt{fill:var(--blue);fill-opacity:.3}
.wchart .wavg{fill:none;stroke:var(--blue);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.wchart .wavg-pt{fill:var(--blue);stroke:var(--surface);stroke-width:2}
.wsum{display:flex;flex-wrap:wrap;gap:10px 18px}
.wsum div{display:flex;flex-direction:column;min-width:0}
.wsum b{font-size:22px;font-weight:700;line-height:1.1}
.wsum span{font-size:12px;color:var(--ink2)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block}
.lg-avg{width:16px;height:2px;background:var(--blue);border-radius:2px}
.lg-pt{width:8px;height:8px;border-radius:50%;background:var(--blue);opacity:.35}
.bcomp{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.bcomp div{background:var(--surface2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.bcomp span{font-size:11.5px;color:var(--ink2);font-weight:600}
.bcomp b{font-size:18px}
.bcomp small{font-size:12px;color:var(--ink2)}
.label-btns{display:flex;flex-wrap:wrap;gap:8px}
.alc{color:var(--ink)}
.warn-t{color:var(--warn)}
.alc-dot i{background:var(--warn)!important}
/* Annuler : pastille ronde compacte (48 px) collée au bord droit, pour ne plus masquer les boutons « + Ajouter » ; le détail est dans aria-label / title */
.undo{position:fixed;z-index:25;right:max(8px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));display:grid;place-items:center;width:48px;height:48px;padding:0;background:var(--ink);color:var(--surface);border-radius:50%;font-size:22px;font-weight:700;line-height:1;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.undo small{display:none}
.undo:disabled{opacity:.35;box-shadow:none}
.hundo{width:40px;height:38px;border-radius:10px;background:var(--surface2);font-size:18px;font-weight:700}
.setup-intro{margin:0;line-height:1.5}

/* v3 : onglets, accueil, sport, santé */
.sec-title{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin:12px 0 -4px;color:var(--ink)}
.slot.empty{padding-block:6px}
.slot.empty .slot-h{min-height:34px}
.sess-list{display:flex;flex-direction:column}
.sess-item{border-top:1px solid var(--line)}
.sess-item:first-child{border-top:0}
.sess-item .item-name b{font-weight:700}
.sess-txt{display:block;font-size:12.5px;color:var(--ink2);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.sess-form{display:flex;flex-direction:column;gap:6px;padding:0 2px 8px}
.sess-form label{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
.water{display:flex;align-items:center;gap:12px}
.water b{font-size:28px;font-weight:700;min-width:84px}
.water .bar{flex:1}
.water-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.water-btns button{font-weight:700;border-radius:12px;padding:11px 6px;background:var(--blue-soft);color:var(--blue)}
.water-btns button:disabled{opacity:.4}
.wz-steps{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.wz-steps i{height:4px;border-radius:9px;background:var(--line)}
.wz-steps i.on{background:var(--red)}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.two{display:grid;grid-template-columns:1fr 1fr}
.opt{display:flex;flex-direction:column;gap:2px;text-align:left;border-radius:12px;padding:11px 12px;background:var(--surface2);border:2px solid transparent}
.opt b{font-weight:700;font-size:15px}
.opt small{font-size:12.5px;color:var(--ink2)}
.opt.on{border-color:var(--blue);background:var(--blue-soft)}
.wz-res{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.wz-res div{background:var(--surface2);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.wz-res span{font-size:11.5px;color:var(--ink2);font-weight:600;line-height:1.2}
.wz-res b{font-size:24px;font-weight:700;line-height:1.1;margin-top:4px}
.wz-res small{font-size:11.5px;color:var(--ink2)}
.calc{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink2)}
.calc b{color:var(--ink)}
.nav button{font-size:10.5px}
.card > .row2,.wrap > .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wz-nav{display:grid;grid-template-columns:1fr 2fr;gap:8px}

/* nav + toast */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-top:4px;padding-bottom:calc(4px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav-in{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;margin:0 auto}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--ink2)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--red)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(116px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--surface);font-size:13px;font-weight:600;padding:8px 14px;border-radius:99px;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.toast.top{top:calc(14px + env(safe-area-inset-top,0px));bottom:auto}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
.habits{grid-template-columns:repeat(auto-fill,minmax(74px,1fr))}
@media (max-width:360px){.chips:not(.three){grid-template-columns:repeat(2,1fr)}.sum-top{grid-template-columns:84px 1fr}}
/* ===== Styles (thèmes). « Tableau de box » = style de base ci-dessus. Chaque style : variables claires, puis sombres
   (auto selon le téléphone, ou forcé), puis ses décors. Néon est toujours sombre. ===== */
.pow{display:none}
/* -- Sticker pop -- */
:root[data-skin="pop"]{
  --bg:#e7eeff; --surface:#ffffff; --surface2:#eef0f7; --ink:#141414; --ink2:#4a4a55; --line:#cfd4e6;
  --red:#bf351a; --red-soft:#ffe3da; --blue:#2e55d6; --blue-soft:#e3e9ff;
  --good:#0f7845; --good-soft:#c9f5df; --warn:#8a5a00; --warn-soft:#fff0c2;
  --scrim:rgba(20,20,20,.45); --on-red:#ffffff; --edge:#141414; --sh:#141414;
  --pop-y:#ffd84a; --pop-v:#c4b5ff; --pop-m:#43d69c; --pop-s:#ff8a6b; --pop-ink:#141414;
  --f-display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;}
@media (prefers-color-scheme: dark){:root[data-skin="pop"]:not([data-theme="light"]){
  --bg:#14161d; --surface:#1e2129; --surface2:#2a2e38; --ink:#f4f4f6; --ink2:#b4b6c2; --line:#3a3f4c;
  --red:#ff7a5c; --red-soft:#3b211b; --blue:#8fa8ff; --blue-soft:#1f2647;
  --good:#5fe0a6; --good-soft:#173a2c; --warn:#f0b43c; --warn-soft:#3a2d12;
  --scrim:rgba(0,0,0,.6); --on-red:#1a0a05; --edge:#e6e7ec; --sh:#000000; color-scheme:dark}}
:root[data-skin="pop"][data-theme="dark"]{
  --bg:#14161d; --surface:#1e2129; --surface2:#2a2e38; --ink:#f4f4f6; --ink2:#b4b6c2; --line:#3a3f4c;
  --red:#ff7a5c; --red-soft:#3b211b; --blue:#8fa8ff; --blue-soft:#1f2647;
  --good:#5fe0a6; --good-soft:#173a2c; --warn:#f0b43c; --warn-soft:#3a2d12;
  --scrim:rgba(0,0,0,.6); --on-red:#1a0a05; --edge:#e6e7ec; --sh:#000000; color-scheme:dark}
[data-skin="pop"] .card,[data-skin="pop"] .tile{border:2px solid var(--edge);border-radius:20px;box-shadow:4px 4px 0 var(--sh)}
[data-skin="pop"] .slot{border:2px solid var(--edge);border-radius:18px;box-shadow:3px 3px 0 var(--sh)}
[data-skin="pop"] .hab{border:2px solid var(--edge);box-shadow:2px 2px 0 var(--sh)}
[data-skin="pop"] .tag{font-weight:800;font-size:15px;letter-spacing:0;text-transform:none;line-height:1.15;color:var(--pop-ink);background:var(--pop-y);border:2px solid var(--edge);border-radius:999px;padding:3px 11px}
[data-skin="pop"] .tag.blue{background:var(--pop-v)}
[data-skin="pop"] .slot:nth-child(4n+2) .tag{background:var(--pop-m)}
[data-skin="pop"] .slot:nth-child(4n+3) .tag{background:var(--pop-s)}
[data-skin="pop"] .slot:nth-child(4n) .tag{background:var(--pop-v)}
[data-skin="pop"] .slot .tag{transform:rotate(-1.5deg)}
[data-skin="pop"] .slot:nth-child(even) .tag{transform:rotate(1.5deg)}
[data-skin="pop"] .dh-title{font-weight:800;font-size:26px;letter-spacing:-.01em}
[data-skin="pop"] .sec-title,[data-skin="pop"] .rc-title{font-weight:800;text-transform:none;letter-spacing:-.01em}
[data-skin="pop"] .ring-txt b,[data-skin="pop"] .tile b{font-weight:800}
[data-skin="pop"] .ic{color:var(--ink);border:2px solid var(--edge);border-radius:50%;box-shadow:2px 2px 0 var(--sh)}
[data-skin="pop"] .seg{background:var(--surface);border:2px solid var(--edge);border-radius:999px}
[data-skin="pop"] .seg button{border-radius:999px;border:2px solid transparent}
[data-skin="pop"] .seg button[aria-pressed="true"],[data-skin="pop"] .seg button[aria-pressed="true"] small{background:var(--pop-y);color:var(--pop-ink);border-color:var(--edge);box-shadow:none}
[data-skin="pop"] .seg button[aria-pressed="true"] small{border:0}
[data-skin="pop"] .btn{font-family:var(--f-display);font-weight:800;border:2px solid var(--edge);border-radius:14px;box-shadow:3px 3px 0 var(--sh)}
[data-skin="pop"] .btn.ghost{background:var(--surface)}
[data-skin="pop"] .btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--sh)}
[data-skin="pop"] .add{color:var(--surface);background:var(--ink);border-radius:999px}
[data-skin="pop"] .add.blue{color:var(--pop-ink);background:var(--pop-v);border:2px solid var(--edge)}
[data-skin="pop"] .chip{background:var(--surface);border:2px solid var(--line)}
[data-skin="pop"] .chip.tap{border-style:dashed}
[data-skin="pop"] .chip.on{background:var(--pop-m);color:var(--pop-ink);border:2px solid var(--edge)}
[data-skin="pop"] .chip.on:nth-child(2n){background:var(--pop-v)}
[data-skin="pop"] .supp.on,[data-skin="pop"] .eve-it.on{background:var(--pop-m);color:var(--pop-ink);border:2px solid var(--edge)}
[data-skin="pop"] .eve-it.on .eve-box{background:var(--pop-ink);border-color:var(--pop-ink);color:var(--pop-m)}
[data-skin="pop"] .opt.on{border-color:var(--edge);background:var(--pop-y);color:var(--pop-ink)}
[data-skin="pop"] .opt.on small{color:var(--pop-ink)}
[data-skin="pop"] .bar{height:14px;background:var(--surface);border:2px solid var(--edge)}
[data-skin="pop"] .bar i{background:var(--pop-s)}
[data-skin="pop"] .bar i.ok{background:var(--pop-m)}
[data-skin="pop"] .bar i.over{background:var(--pop-y)}
[data-skin="pop"] input,[data-skin="pop"] textarea,[data-skin="pop"] select{border:2px solid var(--line);border-radius:12px}
[data-skin="pop"] .banner{border:2px solid var(--edge)}
[data-skin="pop"] .pill{box-shadow:inset 0 0 0 1.5px currentColor}
[data-skin="pop"] .nav{border-top:2px solid var(--edge)}
[data-skin="pop"] .nav button svg{box-sizing:content-box;padding:1px 12px;border:2px solid transparent;border-radius:999px}
[data-skin="pop"] .nav button[aria-current="page"]{color:var(--ink)}
[data-skin="pop"] .nav button[aria-current="page"] svg{color:var(--pop-ink);background:var(--pop-y);border-color:var(--edge)}
[data-skin="pop"] .undo{color:var(--pop-ink);background:var(--pop-y);border:2px solid var(--edge);box-shadow:3px 3px 0 var(--sh)}
[data-skin="pop"] .sheet{border:2px solid var(--edge);border-bottom:0}
[data-skin="pop"] .toast{border:2px solid var(--edge)}
[data-skin="pop"] .wz-steps i{height:8px;border:2px solid var(--edge);background:var(--surface)}
[data-skin="pop"] .wz-steps i.on{background:var(--pop-y)}

/* -- Néon : toujours sombre -- */
:root[data-skin="neon"]{
  --bg:#0b0e13; --surface:#141922; --surface2:#1d232e; --ink:#eef2f7; --ink2:#9aa3b2; --line:#262d39;
  --red:#ff4fd8; --red-soft:#341a35; --blue:#3de0ff; --blue-soft:#0e2d36;
  --good:#c6ff3d; --good-soft:#26310f; --warn:#ffb547; --warn-soft:#33270f;
  --scrim:rgba(0,0,0,.65); --on-red:#0b0e13; color-scheme:dark;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
[data-skin="neon"] body{background:radial-gradient(130% 380px at 50% 0,#172131 0,rgba(11,14,19,0) 100%) no-repeat,var(--bg)}
[data-skin="neon"] .card,[data-skin="neon"] .slot,[data-skin="neon"] .tile,[data-skin="neon"] .hab{border-color:rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
[data-skin="neon"] .card,[data-skin="neon"] .slot{border-radius:18px}
[data-skin="neon"] .tag{font-weight:700;font-size:12px;letter-spacing:.1em;line-height:1.3;padding:2px 0;border:0;background:none;text-shadow:0 0 10px rgba(255,79,216,.65)}
[data-skin="neon"] .tag.blue{text-shadow:0 0 10px rgba(61,224,255,.6)}
[data-skin="neon"] .dh-title{font-size:21px;line-height:1.2;letter-spacing:.01em}
[data-skin="neon"] .sec-title{font-size:15px;letter-spacing:.12em}
[data-skin="neon"] .rc-title{font-size:18px}
[data-skin="neon"] .ring-txt b,[data-skin="neon"] .tile b,[data-skin="neon"] .num{font-weight:800;letter-spacing:-.01em}
[data-skin="neon"] .ring svg{filter:drop-shadow(0 0 5px rgba(61,224,255,.45))}
[data-skin="neon"] .btn{box-shadow:0 0 18px rgba(255,79,216,.35)}
[data-skin="neon"] .btn.ghost{box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
[data-skin="neon"] .btn:disabled{box-shadow:none}
[data-skin="neon"] .add{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,79,216,.6)}
[data-skin="neon"] .add.blue{background:transparent;box-shadow:inset 0 0 0 1px rgba(61,224,255,.55)}
[data-skin="neon"] .bar{background:#1f2631}
[data-skin="neon"] .bar i{box-shadow:0 0 10px rgba(61,224,255,.75)}
[data-skin="neon"] .bar i.ok{box-shadow:0 0 10px rgba(198,255,61,.75)}
[data-skin="neon"] .bar i.over{box-shadow:0 0 10px rgba(255,181,71,.75)}
[data-skin="neon"] .chip.on,[data-skin="neon"] .supp.on,[data-skin="neon"] .eve-it.on{box-shadow:inset 0 0 0 1px rgba(198,255,61,.45)}
[data-skin="neon"] .eve-it.on .eve-box{color:#0b0e13}
[data-skin="neon"] .seg button[aria-pressed="true"]{background:#283040;box-shadow:inset 0 0 0 1px rgba(61,224,255,.55)}
[data-skin="neon"] .opt.on{box-shadow:0 0 14px rgba(61,224,255,.25)}
[data-skin="neon"] .wz-steps i.on{box-shadow:0 0 8px rgba(255,79,216,.7)}

  function keyOf(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
  function parseKey(k){var p=k.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])}
  function addDays(k,n){var d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d)}
  function mondayOf(k){var d=parseKey(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return keyOf(d)}
  function todayKey(){return keyOf(new Date())}
  function fmt(n){return Math.round(n).toLocaleString("fr-FR")}
  function fmt2(n){var r=Math.round(n*100)/100;return r.toLocaleString("fr-FR",{maximumFractionDigits:2})}
  function fmt1(n){var r=Math.round(n*10)/10;return r.toLocaleString("fr-FR",{maximumFractionDigits:1})}
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

  function newer(a,b){return a.date<b.date?1:a.date>b.date?-1:(b.createdAt||"").localeCompare(a.createdAt||"")}

  /* ---------- estimation (Claude) ---------- */
  function canEst(){return !!S.sample&&!S.sampleOff}
  async function estimate(desc){
    var prompt="Tu chiffres un repas pour un carnet de suivi nutritionnel (homme adulte sportif, France).\nRepas noté : « "+desc.slice(0,300)+" »\nSi une quantité est indiquée, utilise-la. Sinon, prends une portion standard d'adulte en France. Appuie-toi sur les valeurs moyennes de la table Ciqual (ANSES) quand c'est possible.\nRéponds uniquement avec un objet JSON de cette forme : {\"kcal\": 650, \"prot\": 38, \"hyp\": \"200 g de poulet, 150 g de riz cuit, légumes\"}. kcal = entier, prot = grammes de protéines, hyp = la portion que tu as supposée, en 12 mots maximum.";
    var r=await S.sample.json(prompt,{modelTier:"quick"});
    var k=Math.round(Number(r&&r.kcal)),p=Math.round(Number(r&&r.prot)*10)/10;
    if(!(k>=0&&k<=4000)||!(p>=0&&p<=300))throw {code:"invalid_json"};
    return {kcal:k,prot:p,hyp:String((r&&r.hyp)||"").slice(0,140)}}
  function estErr(e){var c=e&&e.code;

  /* ---------- saving ---------- */

  async function flush(k){

    running[k]={again:false};
    try{
      do{running[k].again=false;var body=clone(S.days[k]);body.updatedAt=new Date().toISOString();await writeDoc(col("days").doc(k),body)}while(running[k].again);
      toast("Enregistré");
    }catch(e){showErr(e)}
    finally{delete running[k];if(!timers[k])delete dirty[k]}
  }

    var local=clone(body);local.id=id;pendingL[id]=local;syncLifts();

    if(c==="revoked"||c==="PGRST301"||c==="42501")return "Ta session a expiré : déconnecte-toi puis reconnecte-toi.";
    if(c==="invalid_argument")return "Enregistrement refusé : ce compte ne peut pas modifier ce carnet.";
    if(c==="resource_exhausted")return "Trop d'enregistrements d'un coup. Attends quelques secondes et réessaie.";
    return "Enregistrement impossible pour le moment. Vérifie ta connexion, puis refais ta dernière saisie."}

    else if(S.status==="slow")h+='<div class="banner">Ton carnet ne répond pas encore. Ce que tu vois n\'est peut-être pas à jour.</div>';
    else if(S.status==="noconfig")h+='<div class="banner">Configuration manquante : renseigne l\'adresse et la clé Supabase dans config.js, puis republie le site.</div>';

  function eveWeek(keys){if(!eveList().length||!keys.some(function(k){return S.days[k]&&S.days[k].evening}))return null;

  function authErr(e){var m=(e&&e.message)||"";
    if(/Invalid login/i.test(m))return "E-mail ou mot de passe incorrect.";

      else if(a.mode==="reset"){r=await SB.auth.resetPasswordForEmail(a.email.trim(),{redirectTo:location.origin+location.pathname});if(r.error)throw r.error;a.msg="Si un compte existe pour cette adresse, un e-mail vient de partir. Ouvre le lien sur ce téléphone."}

    function dsnap(p,fc){var d=cache[p];return {id:last(p),exists:d!==undefined,data:function(){return d},metadata:{fromCache:!!fc,hasPendingWrites:false}}}
    function fire(l,fc){if(l.k==="doc"){l.cb(dsnap(l.p,fc));return}var pre=l.p+"/";
      var docs=Object.keys(cache).filter(function(p){return p.indexOf(pre)===0&&p.slice(pre.length).indexOf("/")<0}).map(function(p){return dsnap(p,fc)});
      l.cb({docs:docs,size:docs.length,empty:!docs.length,docChanges:function(){return []},metadata:{fromCache:!!fc,hasPendingWrites:false}})}
    function emit(){L.forEach(function(l){try{fire(l,!loaded)}catch(e){console.error(e)}})}
    function er(e){var m=(e&&e.message)||String(e||"");return {code:/fetch|network|Failed|Load failed/i.test(m)?"unavailable":(e&&e.code)||"unknown",message:m}}
    async function load(){var all={},from=0,step=1000;
      for(;;){var r=await sb.from("docs").select("path,data").range(from,from+step-1);if(r.error)throw er(r.error);(r.data||[]).forEach(function(x){all[x.path]=x.data});if(!r.data||r.data.length<step)break;from+=step}
      cache=all;loaded=true;persist();emit()}
    async function set(p,b){cache[p]=JSON.parse(JSON.stringify(b));persist();emit();var r;try{r=await sb.from("docs").upsert({user_id:uid,path:p,data:b,updated_at:new Date().toISOString()},{onConflict:"user_id,path"})}catch(e){throw er(e)}if(r.error)throw er(r.error)}
    async function del(p){delete cache[p];persist();emit();var r;try{r=await sb.from("docs").delete().eq("path",p)}catch(e){throw er(e)}if(r.error)throw er(r.error)}
    function listen(l){L.push(l);if(Object.keys(cache).length)setTimeout(function(){fire(l,!loaded)},0);return function(){L=L.filter(function(x){return x!==l})}}
    function docRef(p){return {set:function(b){return set(p,b)},delete:function(){return del(p)},onSnapshot:function(cb){return listen({k:"doc",p:p,cb:cb})}}}
    return {load:load,doc:docRef,collection:function(p){return {doc:function(id){return docRef(p+"/"+id)},onSnapshot:function(cb){return listen({k:"col",p:p,cb:cb})}}},
      exportAll:function(){return JSON.parse(JSON.stringify(cache))},
      importAll:async function(map){var now=new Date().toISOString(),rows=Object.keys(map).filter(function(p){return /^carnet(\/(days|favs|lifts|foods|recaps)\/[A-Za-z0-9_.:@+~-]{1,80})?$/.test(p)&&map[p]&&typeof map[p]==="object"&&!Array.isArray(map[p])}).map(function(p){return {user_id:uid,path:p,data:map[p],updated_at:now}});
        for(var i=0;i<rows.length;i+=200){var r=await sb.from("docs").upsert(rows.slice(i,i+200),{onConflict:"user_id,path"});if(r.error)throw er(r.error)}
        rows.forEach(function(x){cache[x.path]=x.data});persist();emit();return rows.length},
      clearLocal:function(){try{localStorage.removeItem(LS)}catch(e){}}}}
  function makeAI(){
    async function call(prompt,file,kind){var ses=(await SB.auth.getSession()).data.session;if(!ses)throw {code:"session_expired"};
      var body={action:"ai",prompt:prompt};if(kind)body.kind=kind;if(file)body.image=await imgToB64(file);
      var res;try{res=await fetch(CFG.url.replace(/\/$/,"")+"/functions/v1/carnet-api",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+ses.access_token,"apikey":CFG.anonKey},body:JSON.stringify(body)})}catch(e){throw {code:"upstream_error"}}
      var j=null;try{j=await res.json()}catch(e){}
      if(!res.ok){var c=j&&j.error;throw {code:c==="rate_limited"?"rate_limited":c==="unauthorized"?"session_expired":c==="image_rejected"?"image_rejected":c==="not_configured"?"sampling_disabled":"upstream_error"}}
      return String((j&&j.text)||"")}
    function parse(t){try{return JSON.parse(t)}catch(e){}var m=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(m){try{return JSON.parse(m[1])}catch(e){}}var a=t.indexOf("{"),b=t.lastIndexOf("}");if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}throw {code:"invalid_json",text:t}}
    var f=function(){return Promise.reject({code:"invalid_request"})};
    f.json=async function(prompt,opts){var file=opts&&opts.images&&opts.images[0];return parse(await call(prompt,file,opts&&opts.kind))};
    f.limits=function(){return Promise.resolve({images:{maxCount:1}})};
    return f}
  async function imgToB64(file){var url=URL.createObjectURL(file);
    try{var img=await new Promise(function(ok,ko){var i=new Image();i.onload=function(){ok(i)};i.onerror=function(){ko({code:"image_rejected"})};i.src=url});
      var sc=Math.min(1,1280/Math.max(img.naturalWidth||1,img.naturalHeight||1)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.naturalWidth*sc));c.height=Math.max(1,Math.round(img.naturalHeight*sc));
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);return {media_type:"image/jpeg",data:c.toDataURL("image/jpeg",0.85).split(",")[1]}}
    finally{URL.revokeObjectURL(url)}}
  function subscribeAll(){
    var lt=setTimeout(function(){if(S.status==="loading"){S.status="slow";render()}},10000);
    setDoc().onSnapshot(function(snap){var cached=!!(snap.metadata&&snap.metadata.fromCache);
      if(snap.exists){var v=snap.data();S.needSetup=false;
        Object.keys(DEF_SETTINGS).forEach(function(x){if(v[x]!=null&&!timers.__s)S.settings[x]=clone(v[x])})}
      else if(!cached)S.needSetup=true;
      if(!cached||snap.exists){clearTimeout(lt);if(S.status==="loading"||S.status==="slow")S.status="ok"}render()});
    col("days").onSnapshot(function(snap){S.days=Object.assign({},S.days);var seen={};
      snap.docs.forEach(function(d){seen[d.id]=1;if(dirty[d.id])return;S.days[d.id]=clone(d.data())});
      Object.keys(S.days).forEach(function(k){if(!seen[k]&&!dirty[k])delete S.days[k]});render()});
    col("favs").onSnapshot(function(snap){S.favs=snap.docs.map(function(d){var o=clone(d.data());o.id=d.id;return o}).sort(sortFav);
      if(S.sheet&&!S.pick&&!S.label)refreshFavList();else render()});
    col("lifts").onSnapshot(function(snap){S.liftsDb=snap.docs.map(function(d){var o=clone(d.data());o.id=d.id;o.load=+o.load;o.reps=parseInt(o.reps,10);return o}).filter(function(l){return l.move&&l.date&&l.load>0&&l.reps>0});syncLifts();render()});
    col("recaps").onSnapshot(function(snap){var m={};snap.docs.forEach(function(d){var o=d.data();if(o&&o.r)m[d.id]=o});S.recaps=m;render()});
    col("foods").onSnapshot(function(snap){S.myFoods=snap.docs.map(function(d){var o=d.data();return ["u:"+d.id,o.name||"Aliment",o.kw||"",+o.kcal||0,+o.prot||0,Array.isArray(o.units)?o.units:[],o.tag||"","Mes aliments",o.src||"Saisi depuis une étiquette",+o.alc||0]});rebuildFoods();render()});
  }
  function startUser(u){if(S.uid===u.id)return;resetUser();S.uid=u.id;S.email=u.email||"";S.base="carnet";S.status="loading";S.auth=null;
    S.db=makeDb(SB,u.id);subscribeAll();reload();render()}
  function reload(){if(!S.db)return;var db=S.db;db.load().then(function(){if(S.db===db&&(S.status==="offline"||S.status==="error"||S.status==="slow")){S.status="ok";render()}},function(e){if(S.db!==db||S.status==="auth")return;S.status=e&&e.code==="unavailable"?"offline":(S.status==="ok"?"ok":"error");render()})}
  function resetUser(){S.uid=null;S.db=null;S.days={};S.favs=[];S.liftsDb=[];S.lifts=[];S.myFoods=[];S.recaps={};S.recapBusy=null;S.recapMsg=null;rebuildFoods();S.settings=clone(DEF_SETTINGS);S.needSetup=false;S.wiz=null;S.undo=[];S.sheet=null;S.liftSheet=false;S.tab="alim";S.confirmAcct=null;renderUndo()}
  async function init(){
    render();renderUndo();
    if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js")}catch(e){}}
    if(!CFG.url||!CFG.anonKey){S.status="noconfig";render();return}
    if(!window.supabase){S.status="nolib";render();return}
    SB=window.supabase.createClient(CFG.url,CFG.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    S.sample=CFG.ai===false?null:makeAI();S.sampleImg=true;  // ai:false dans config.js = pas de clé Claude : boutons IA masqués
    SB.auth.onAuthStateChange(function(ev,session){setTimeout(function(){if(S.loggingOut)return;
      if(ev==="PASSWORD_RECOVERY"){S.auth={mode:"newpass",email:"",pass:"",consent:false,msg:""};S.status="auth";render();return}
      if(session&&session.user){if(S.status!=="auth"||!S.auth||S.auth.mode!=="newpass")startUser(session.user)}
      else if(ev==="SIGNED_OUT"&&S.uid){var em2=S.email||"";if(S.db)S.db.clearLocal();resetUser();S.status="auth";S.auth={mode:"login",email:em2,pass:"",consent:false,msg:"Tu as été déconnecté. Reconnecte-toi."};render()}},0)});
    var ses=null;try{ses=(await SB.auth.getSession()).data.session}catch(e){}
    if(ses&&ses.user)startUser(ses.user);
    else if(S.status!=="auth"&&!S.uid){S.status="auth";S.auth=S.auth||{mode:"login",email:"",pass:"",consent:false,msg:""};render()}
    document.addEventListener("visibilitychange",function(){if(!document.hidden&&S.db&&!Object.keys(dirty).length&&!Object.keys(running).length&&!timers.__s)reload()});
    window.addEventListener("online",function(){if(S.db)reload()});
  }
  init();
})();
